[project]
name = "repvgg-reproduction"
version = "0.1.0"
description = "Воспроизведение статьи RepVGG: Making VGG-style ConvNets Great Again (CVPR 2021)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "wandb>=0.15",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "ptflops>=0.7",
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "isort>=5.12",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
